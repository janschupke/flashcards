name: Checks

on:
  pull_request:
    branches:
      - '*'
  # Nothing ran on merge before, so a broken master could go unnoticed.
  push:
    branches:
      - master
      - main

# Nothing here needs write access.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, Test, Lint, Format, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mirrors `npm run check` step for step, so a green local run means a
      # green CI run. Split into steps only so failures are easy to read.
      - name: Knip
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # `npm run test:e2e` is build + playwright; the build above is reused.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser accessibility tests
        run: npx playwright test
